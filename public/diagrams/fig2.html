<rect x="274" y="46" width="468" height="64" rx="4" fill="#0b1628" stroke="#1e3d6e" stroke-width="1.5"/>
<text x="508" y="70" font-family="Syne" font-size="11" fill="#9dc8f0" text-anchor="middle" font-weight="700">TEE INPUTS @ EPOCH t</text>
<text x="508" y="88" font-family="JetBrains Mono" font-size="9" fill="#4d9fff" text-anchor="middle">x_t (encrypted data), w_t (witness), τ_t (time oracle), nonce_t (TRNG)</text>
<text x="508" y="103" font-family="JetBrains Mono" font-size="9" fill="#3d5070" text-anchor="middle">C_enc decrypted by k_reg (F5: Blind Policy)  ·  C_hash = H(circuit_bytecode) (F4)</text>

<rect x="274" y="132" width="226" height="58" rx="4" fill="#0b1628" stroke="#1e3d6e" stroke-width="1.5"/>
<text x="387" y="156" font-family="Syne" font-size="11" fill="#9dc8f0" text-anchor="middle" font-weight="700">CIRCUIT EXEC</text>
<text x="387" y="174" font-family="JetBrains Mono" font-size="8.5" fill="#4d9fff" text-anchor="middle">C_hash = H(circuit_bytecode)</text>

<rect x="514" y="132" width="228" height="58" rx="4" fill="#0b1628" stroke="#1e3d6e" stroke-width="1.5"/>
<text x="628" y="156" font-family="Syne" font-size="11" fill="#9dc8f0" text-anchor="middle" font-weight="700">ZKP PROVE</text>
<text x="628" y="171" font-family="JetBrains Mono" font-size="8.5" fill="#4d9fff" text-anchor="middle">π_t = ZKProve(x_t, w_t, C, policy)</text>
<text x="628" y="184" font-family="JetBrains Mono" font-size="8.5" fill="#4d9fff" text-anchor="middle">F8: Silence · 24 sub-epochs</text>

<rect x="274" y="214" width="468" height="66" rx="4" fill="#0d1f36" stroke="#2a5fa0" stroke-width="2" filter="url(#gw)"/>
<text x="508" y="238" font-family="Syne" font-size="12" fill="#4df0b0" text-anchor="middle" font-weight="700">TEE ATTESTATION QUOTE  A_t</text>
<text x="508" y="256" font-family="JetBrains Mono" font-size="9" fill="#4d9fff" text-anchor="middle">A_t = TEE_Attest( MRENCLAVE ‖ C_hash ‖ Policy_t ‖ τ_t ‖ nonce_t )</text>
<text x="508" y="272" font-family="JetBrains Mono" font-size="8.5" fill="#3d5070" text-anchor="middle">Hardware-signed ·  binds F4 (circuit) ‖ F3 (time oracle) ‖ F5 (policy)</text>

<rect x="274" y="304" width="468" height="76" rx="4" fill="#071a0e" stroke="#3dffa0" stroke-width="2" filter="url(#gw)"/>
<text x="508" y="330" font-family="Syne" font-size="12" fill="#3dffa0" text-anchor="middle" font-weight="700">AGKD — ATTESTATION-GATED KEY DERIVATION</text>
<text x="508" y="350" font-family="JetBrains Mono" font-size="10" fill="#3dffa0" text-anchor="middle">vk_t = H( vk_{t-1} ‖ A_t ‖ Policy_t )</text>
<text x="508" y="370" font-family="JetBrains Mono" font-size="9" fill="#2a7a4a" text-anchor="middle">No valid A_t  ⟹  No valid vk_t  ·  Forward secrecy across epochs</text>

<rect x="274" y="406" width="468" height="76" rx="4" fill="#071a0e" stroke="#3dffa0" stroke-width="2" filter="url(#gw)"/>
<text x="508" y="432" font-family="Syne" font-size="12" fill="#3dffa0" text-anchor="middle" font-weight="700">RECURSIVE GRAPH HASH</text>
<text x="508" y="452" font-family="JetBrains Mono" font-size="10" fill="#3dffa0" text-anchor="middle">GH_t = H( GH_{t-1} ‖ A_t ‖ π_t ‖ vk_t )</text>
<text x="508" y="470" font-family="JetBrains Mono" font-size="9" fill="#2a7a4a" text-anchor="middle">Tamper-evident: any change in any prior epoch → GH_t mismatch</text>

<rect x="274" y="510" width="468" height="40" rx="4" fill="#071a0e" stroke="#2a7a4a" stroke-width="1.5"/>
<text x="508" y="527" font-family="Syne" font-size="11" fill="#3dffa0" text-anchor="middle" font-weight="700">PORTABLE PROOF BUNDLE  B_t</text>
<text x="508" y="543" font-family="JetBrains Mono" font-size="8.5" fill="#2a7a4a" text-anchor="middle">{ π_t ,  A_t ,  vk_t ,  GH_t ,  manifest_t }</text>
